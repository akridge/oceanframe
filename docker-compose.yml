services:
  oceanframe:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Set to 1 to bake CLIP / YOLO / SAM 3 into the image.
        WITH_ML: "${WITH_ML:-0}"
    image: oceanframe-web:latest
    container_name: oceanframe-web
    ports:
      - "80:80"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 80
      OPEN_BROWSER: "0"
      PYTHONUNBUFFERED: "1"
      # ── Image library ──────────────────────────────────────────────────────
      LIB_DATA_DIR: /data/library
      # Bucket or directory to offer by default, e.g. gs://my-survey-bucket/2024
      LIB_SOURCE: "${LIB_SOURCE:-}"
      # "auto" uses CLIP when installed and falls back to the hash descriptor.
      LIB_EMBED_BACKEND: "${LIB_EMBED_BACKEND:-auto}"
      # A local path or a gs:// URI; gs:// weights are cached into LIB_MODEL_DIR.
      # NOAA publishes a coral detector at
      #   gs://nmfs_odp_pifsc/PIFSC/ESD/ARP/pifsc-ai-data-repository/models/yolo11-esa-icra-detector.pt
      LIB_YOLO_MODEL: "${LIB_YOLO_MODEL:-yolo11n.pt}"
      LIB_SAM3_MODEL: "${LIB_SAM3_MODEL:-sam3.pt}"
      LIB_MODEL_DIR: /app/models
      # auto = use ADC when present, fall back to an anonymous client so public
      # buckets (NOAA's open data) work with no credentials at all.
      LIB_GCS_ANONYMOUS: "${LIB_GCS_ANONYMOUS:-auto}"
      # Named groups become key:value tags, e.g.
      #   (?P<year>\d{4})/(?P<site>[^/]+)/(?P<transect>T\d+)
      LIB_PATH_TAG_PATTERN: "${LIB_PATH_TAG_PATTERN:-}"
      # Application Default Credentials for the GCS source.
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-}"
    volumes:
      - oceanframe_uploads:/app/uploads
      - oceanframe_library:/data/library
      # Mount the host's ADC so the container can read gs:// without a key file.
      # Harmless when the directory does not exist.
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
      # Model weights (sam3.pt, custom YOLO checkpoints) live outside the image.
      - ./models:/app/models
    restart: unless-stopped

volumes:
  oceanframe_uploads:
  oceanframe_library:
